[project]
name = "bondelo-backend"
version = "0.1.0"
description = "HTTP API for the Bondelo Telegram bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "alembic>=1.14",
    # Arrives with fastapi[standard] anyway; pinned directly because the tests drive the
    # app through it.
    "httpx>=0.28.1",
    # The official T-Invest SDK — see [tool.uv.sources], it is not on PyPI.
    "t-tech-investments>=1.49.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "basedpyright>=1.23",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.basedpyright]
pythonVersion = "3.13"
# `standard` rather than `all`: strict mode drowns in false positives from
# SQLAlchemy's declarative typing and FastAPI's dependency defaults.
typeCheckingMode = "standard"
include = ["app"]

[tool.pytest.ini_options]
# Все тесты асинхронные, отдельный маркер на каждый не нужен.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Проект не ставится пакетом (build-system нет), `app` импортируется из корня —
# так же, как его видит uvicorn в контейнере.
pythonpath = ["."]

# T-Bank publishes the SDK on its own GitLab, not on PyPI. `explicit` keeps that index out
# of the way of every other dependency — only the package named below is looked up there.
[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
explicit = true

[tool.uv.sources]
t-tech-investments = { index = "tbank" }
